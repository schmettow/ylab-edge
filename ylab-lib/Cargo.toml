[package]
name = "ylab-lib"
version = "0.1.0"
edition = "2024"

[lib]
name = "ylab_lib"
path = "src/mod.rs"

[dependencies]

# Embassy
embassy-embedded-hal = { version = "0.5.0", features = ["defmt"] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-futures = { version = "0.1.2", features = ["defmt"] }
embassy-executor = "0.9.1"

# Embedded traits
embedded-hal-async = "1.0.0"
embedded-hal = "1.0.0"

# Others
static_cell = "1.3.0"
heapless = "0.9.1"
log = "0.4.28"

# Devices
ssd1306 = { version = "0.10.0", features = ["async"] }
scd4x = { version = "0.4.1", features = ["embedded-hal-async", "scd41"] }
max3010x = { git = "https://github.com/schmettow/async-max3010x-rs" }
bmi160 = { git = "https://github.com/schmettow/async-bmi160-rs" }
tlv493d = { git = "https://github.com/schmettow/async-tlv493d-rs" }
lsm6dsox = { git = "https://github.com/schmettow/async-lsm6dsox-rs" }
xca9548a = { git = "https://github.com/schmettow/async-xca9548a-rs" }
ads1299 = { git = "https://github.com/schmettow/async-ads1299-rs" }
async-sen5x = { git = "https://github.com/schmettow/async-sen5x-rs" }
ads1x1x = { git = "https://github.com/schmettow/async-ads1x1x-rs" }
defmt = "1.0.1"

[features]
default = []
