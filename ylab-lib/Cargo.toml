[package]
name = "ylab-lib"
version = "0.1.0"
edition = "2024"

[lib]
name = "ylab_lib"
path = "src/mod.rs"


[dependencies]
embassy-embedded-hal = { version = "0.5.0", features = ["defmt"] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
static_cell = "1.3.0"
heapless = "0.9.1"
embedded-hal-async = "1.0.0"
embedded-hal = "1.0.0"
log = "0.4.28"

ssd1306 = { version = "0.10.0", features = ["async"] }
scd4x = { version = "0.4.1", features = ["embedded-hal-async", "scd41"] }
lsm6dsox = { path = "../ylab-sensors/async-lsm6dsox-rs" }
xca9548a = { path = "../ylab-sensors/async-xca9548a-rs" }
ads1299 = { path = "../ylab-sensors/async-ads1299-rs" }
async-sen5x = { path = "../ylab-sensors/async-sen5x-rs" }
ads1x1x = { path = "../ylab-sensors/async-ads1x1x-rs" }
bmi160 = { path = "../ylab-sensors/async-bmi160-rs" }                     #"0.3.0"
embassy-futures = { version = "0.1.2", features = ["defmt"] }
embassy-executor = "0.9.1"
