[package]
edition = "2024"
name = "ylab-edge-go"
version = "0.4.0"
license = "MIT OR Apache-2.0"
resolver = "3"

[lib]
name = "ylab"
path = "src/ylab/mod.rs"

[dependencies]
ylab-lib = { path = "../ylab-lib" }
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"

defmt = "1.0.1"
defmt-rtt = "1.1.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
embassy-executor = { version = "0.9.1", features = [
    "arch-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-rp = { version = "0.8.0", features = [
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "rp2040",
] }
embassy-usb-logger = { version = "0.5.1" }
log = "0.4.28"
embassy-sync = "0.7.2"
