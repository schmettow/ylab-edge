[package]
edition = "2021"
name = "ylab-edge-go"
version = "0.4.0"
license = "MIT OR Apache-2.0"
resolver = "2"

[features]
default = []
#mpu6886 = ["dep:mpu6886"]
#tlv493d = ["dep:tlv493d"]


[lib]
name = "ylab"
path = "src/ylab/mod.rs"

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"

defmt = "1.0.1"
defmt-rtt = "1.1.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

embassy-embedded-hal = { version = "0.5.0", features = ["defmt"] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-executor = { version = "0.9.1", features = [
    "arch-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { version = "0.5.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-rp = { version = "0.8.0", features = [
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "rp2040",
] }
embassy-usb = { version = "0.5.1", features = ["defmt"] }
embassy-net = { version = "0.7.1", features = [
    "defmt",
    "icmp",
    "tcp",
    "udp",
    "raw",
    "dhcpv4",
    "medium-ethernet",
    "dns",
    "proto-ipv4",
    "proto-ipv6",
    "multicast",
] }
embassy-net-wiznet = { version = "0.2.1", features = ["defmt"] }
embassy-futures = { version = "0.1.2" }
embassy-usb-logger = { version = "0.5.1" }

static_cell = "1.3.0"
fixed = "1.29"
fixed-macro = "1.2.0"
smart-leds = "0.4.0"
embedded-hal = { version = "1.0.0" }
lsm6ds33 = "0.5.0"
ads1x1x = "0.3.0"
#embedded-ads111x = "0.1.1"
ssd1306 = { version = "0.10.0", features = ["async"] }
embedded-graphics = "0.8"
itoa = "1.0.15"
heapless = "0.9.1"
nb = "1.1.0"
bmi160 = "1.1.0"
# bmi160 = {path = "../bmi160-async"}
mlx9061x = "0.3.0"
scd4x = { version = "0.4.1", default-features = false, features = ["scd41"] }
max3010x = { path = "../async-max3010x-rs", default-features = false }
lsm6dsox = { path = "../lsm6dsox" }
xca9548a = { path = "../async-xca9548a-rs" }
#sensor-tlv493d = {version = "0.1.0", default-features = false}
embedded-hal-async = { version = "1.0.0" }
shared-bus = { version = "0.3.1", features = ["cortex-m"] }
log = "0.4.28"

tlv493d = { path = "../tlv493d", optional = false }
#mpu6886 = { path = "../mpu6886", optional = true }

## network drivers for cyw43 (pico W) or wiznet w5500
# embassy-net = { version = "0.1.0", features = ["defmt", "nightly", "tcp", "dhcpv4", "medium-ethernet"] }
# embassy-net-driver-channel = { version = "0.1.0"}
# embassy-net-w5500 = { version = "0.1.0", features = ["defmt"] }
# cyw43 = { version = "0.1.0", features = ["defmt", "firmware-logs"] }
# cyw43-pio = { version = "0.1.0", features = ["defmt", "overclock"] }

[patch.crates-io]

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 's'
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 's'
overflow-checks = true

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
