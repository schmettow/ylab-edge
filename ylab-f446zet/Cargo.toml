[package]
edition = "2021"
name = "ylab-edge-pro"
version = "0.1.0"
license = "MIT OR Apache-2.0"
resolver = "2"

[lib]
name = "ylab"
path = "src/ylab/mod.rs"

[dependencies]
ylab-lib = { path = "../ylab-lib" }
cortex-m = { version = "0.7.6", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.0"

defmt = "1.0.1"
defmt-rtt = "1.1.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

embassy-stm32 = { version = "0.4.0", features = [
    "defmt",
    "stm32f446ze",
    "memory-x",
    "time-driver-any",
    "exti",
] }
embassy-embedded-hal = { version = "0.5.0", features = ["defmt"] }
embassy-executor = { version = "0.9.1", features = [
    "arch-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-futures = { version = "0.1.2" }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
#embassy-usb = { version = "0.3.0", features = ["defmt"] }
#embassy-usb-logger = { version = "0.2.0" }

log = "0.4"


static_cell = "2.1.1"
fixed = "1.29.0"
fixed-macro = "1.2.0"
heapless = "0.9.1"
#usbd-serial = "0.2.0"
#usb-device = "0.3.1"
nb = "1.1.0"
#scd4x = { version = "0.3.0", default-features=false, features = ["scd41"] }
#scd4x = { version = "0.4.1" }
ryu = "1.0.20"
#lsm6dsox = "2.0.0"
xca9548a = "1.0.0"
embedded-hal-async = "1.0.0"
ads1299 = { path = "../ylab-sensors/async-ads1299-rs" }
#lsm6dsox = { path = "../ylab-sensors/async-lsm6dsox-rs" }
embedded-hal = "1.0.0"
sen5x-rs = "0.2.1"
